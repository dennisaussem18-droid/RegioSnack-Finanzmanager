<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RegioSnack Finanzmanager</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#0b1425;color:#fff;max-width:720px;margin:auto;padding:20px}section{background:#18283e;padding:20px;border-radius:18px;margin:16px 0}input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #456;background:#101c30;color:white;font:inherit}button{background:#176d54;font-weight:bold}label,small{color:#bdcde0}strong{font-size:30px;color:#6de6ac}article{border-bottom:1px solid #456;padding:12px 0}progress{width:100%;accent-color:#6de6ac}</style><h1>RegioSnack Finanzmanager</h1><small>Automatisch lokal gespeichert</small><section><h2>Tagesabrechnung</h2><label>FYRST Hauptkonto (€)</label><input id="bank" type="number" min="0" step=".01"><label>EC-Auszahlung am Wochenende (€)</label><input id="ec" type="number" min="0" step=".01"><button onclick="receiveEC()">EC-Geldeingang auf FYRST bestätigen</button><label>Heute mitgenommenes Bargeld (€)</label><input id="cash" type="number" min="0" step=".01"><button onclick="daily()">Tagesbetrag speichern</button><div id="week"></div><button onclick="deposit()">Bargeldeinzahlung bestätigen</button><label>Benötigtes Betriebsgeld (€)</label><input id="buffer" type="number" min="0" step=".01"><div id="result"></div><label>Tatsächlich überwiesen (€)</label><input id="actual" type="number" min="0" step=".01"><button onclick="book()">Überweisung bestätigen</button></section><section><h2>Fixkosten und Rücklagen</h2><div id="costs"></div><label for="costname">Kostenbezeichnung</label><input id="costname" placeholder="z. B. Foodtruck-Miete"><label for="costamount">Monatlicher Betrag (€)</label><input id="costamount" inputmode="decimal" placeholder="654,50"><label for="costdue">Fälligkeitstag (1–31)</label><input id="costdue" inputmode="numeric" placeholder="15"><button onclick="addCost()">Kosten speichern</button><p id="costmsg" role="status"></p></section><section><h2>Gesamtübersicht</h2><div id="summary"></div><div id="history"></div><button onclick="backup()">Sicherung exportieren</button><label>Sicherung importieren</label><input id="restore" type="file" accept=".json"></section><script>
const $=id=>document.getElementById(id),money=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'}),num=id=>Math.max(0,Number($(id).value)||0),rnd=n=>Math.round(n*100)/100,month=()=>new Date().toLocaleDateString('sv-SE').slice(0,7);
let s;try{s=JSON.parse(localStorage.getItem('regiofinance'))}catch{}s=s||{inputs:{},costs:[],history:[]};
const today=()=>new Date().toLocaleDateString('sv-SE');
s.daily=s.daily||{};
s.pendingCash=s.pendingCash??(Number(s.inputs.cash)||0);
if(s.cashDate!==today()){s.inputs.cash='';s.cashDate=today()}
function save(){localStorage.setItem('regiofinance',JSON.stringify(s))}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
for(let k of ['bank','ec','cash','buffer']){$(k).value=s.inputs[k]??'';$(k).oninput=()=>{s.inputs[k]=$(k).value;save();render()}}
function daily(){let d=today(),v=rnd(num('cash')),old=s.daily[d];if(old?.deposited)return alert('Dieser Tagesbetrag wurde bereits eingezahlt.');if(!$( 'cash').value.trim())return alert('Tagesbetrag eingeben');s.pendingCash=rnd(Math.max(0,s.pendingCash-(old?.amount||0)+v));s.daily[d]={amount:v,deposited:false};s.history.push({type:'Tagesbargeld gespeichert',amount:v,date:new Date().toLocaleString('de-DE')});save();render()}
function deposit(){let v=s.pendingCash;if(!v||!confirm(money(v)+' tatsächlich auf FYRST eingezahlt?'))return;$('bank').value=rnd(num('bank')+v);s.inputs.bank=$('bank').value;s.pendingCash=0;Object.values(s.daily).forEach(x=>x.deposited=true);s.history.push({type:'Bargeldeinzahlung',amount:v,date:new Date().toLocaleString('de-DE')});save();render()}
function receiveEC(){let v=num('ec');if(!v||!confirm(money(v)+' tatsächlich auf FYRST eingegangen?'))return;$('bank').value=rnd(num('bank')+v);s.inputs.bank=$('bank').value;$('ec').value='';s.inputs.ec='';s.history.push({type:'EC-Auszahlung',amount:v,date:new Date().toLocaleString('de-DE')});save();render()}
function week(){let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));let start=d.toLocaleDateString('sv-SE'),end=new Date(d);end.setDate(end.getDate()+6);let entries=Object.entries(s.daily).filter(([k])=>k>=start&&k<=end.toLocaleDateString('sv-SE')).sort();$('week').innerHTML='<h3>Diese Woche</h3>'+entries.map(([k,x])=>'<p>'+esc(k)+' · '+money(x.amount)+'</p>').join('')+'<p>Wochenbargeld: '+money(entries.reduce((a,[k,x])=>a+x.amount,0))+'</p><p>Noch nicht eingezahlt: '+money(s.pendingCash)+'</p>'}
function open(c){return c.paid===month()?0:Math.max(0,c.amount-c.saved)}
function days(c){let d=new Date();return Math.max(1,Math.min(c.due,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())-d.getDate()+1)}
function calc(){let target=rnd(s.costs.reduce((a,c)=>a+open(c)/days(c),0)),available=Math.max(0,num('bank')-num('buffer'));return {target,available,rec:rnd(Math.min(target,available))}}
function render(){week();let r=calc(),total=s.costs.reduce((a,c)=>a+c.saved,0),goal=s.costs.reduce((a,c)=>a+c.amount,0),all=s.history.filter(h=>h.type==='Überweisung').reduce((a,h)=>a+h.amount,0);$('result').innerHTML='<p>Gesamtmittel inklusive Bargeld und EC: '+money(num('bank')+num('ec')+s.pendingCash)+'</p><p>Heutiges Soll: '+money(r.target)+'</p><small>Heute aufs Unterkonto</small><br><strong>'+money(r.rec)+'</strong><p>Nach Überweisung verfügbar: '+money(num('bank')-r.rec)+'</p><small>Fehlbetrag heute: '+money(r.target-r.rec)+' · Nur verfügbares Bankguthaben zählt für die Überweisung.</small>';$('costs').innerHTML=s.costs.map((c,i)=>'<article><b>'+esc(c.name)+'</b><p>'+money(c.saved)+' / '+money(c.amount)+' · fällig am '+c.due+'.</p><progress max="'+c.amount+'" value="'+Math.min(c.saved,c.amount)+'"></progress><button onclick="edit('+i+')">Bearbeiten</button><button onclick="paid('+i+')">'+(c.paid===month()?'Bezahlt':'Als bezahlt markieren')+'</button></article>').join('')||'Bitte deine Fixkosten hinzufügen.';$('summary').innerHTML='<small>Aktuell zurückgelegt</small><br><strong>'+money(total)+'</strong><p>Insgesamt überwiesen: '+money(all)+'</p><p>Monatliches Ziel: '+money(goal)+'</p><p>Noch offen: '+money(s.costs.reduce((a,c)=>a+open(c),0))+'</p>';$('history').innerHTML=s.history.slice().reverse().map(h=>'<article>'+esc(h.date)+' · '+esc(h.type)+' · '+money(h.amount)+'</article>').join('')}
function addCost(){const name=$('costname').value.trim(),amount=Number($('costamount').value.trim().replace(',','.')),due=Number($('costdue').value);if(!name||!Number.isFinite(amount)||amount<=0||!Number.isInteger(due)||due<1||due>31){$('costmsg').textContent='Bitte Bezeichnung, gültigen Betrag und Fälligkeitstag 1–31 eingeben.';return;}s.costs.push({name,amount:rnd(amount),due,saved:0,paid:''});try{save()}catch(e){s.costs.pop();$('costmsg').textContent='Speichern fehlgeschlagen. Bitte Browserspeicher prüfen.';return;}render();for(const k of ['costname','costamount','costdue'])$(k).value='';$('costmsg').textContent=name+' erfolgreich gespeichert.';} function add(){let name=prompt('Kostenbezeichnung'),amount=Number(prompt('Monatlicher Betrag in Euro')),due=Number(prompt('Fälligkeitstag (1–31)'));if(!name||!(amount>0)||!Number.isInteger(due)||due<1||due>31)return;s.costs.push({name,amount,due,saved:0,paid:''});save();render()}
function edit(i){let c=s.costs[i],name=prompt('Bezeichnung (leer zum Löschen)',c.name);if(name===null)return;if(!name){if(!c.saved&&confirm('Löschen?'))s.costs.splice(i,1)}else{let a=prompt('Betrag',c.amount),d=prompt('Fälligkeitstag',c.due),v=prompt('Vorhandene Rücklage',c.saved);if([a,d,v].some(x=>x===null)||!(Number(a)>0)||!Number.isInteger(Number(d))||Number(d)<1||Number(d)>31||!(Number(v)>=0))return;Object.assign(c,{name,amount:Number(a),due:Number(d),saved:Number(v)})}save();render()}
function book(){let v=rnd(num('actual')),r=calc();if(!v||v>r.available||v>s.costs.reduce((a,c)=>a+open(c),0))return alert('Betrag prüfen');if(!confirm('Tatsächlich '+money(v)+' überwiesen?'))return;let left=v;[...s.costs].sort((a,b)=>days(a)-days(b)).forEach(c=>{let x=Math.min(left,open(c));c.saved=rnd(c.saved+x);left=rnd(left-x)});s.history.push({type:'Überweisung',amount:v,date:new Date().toLocaleString('de-DE')});$('bank').value=rnd(num('bank')-v);s.inputs.bank=$('bank').value;$('actual').value='';save();render()}
function paid(i){let c=s.costs[i];if(c.paid===month()||!confirm('Rechnung bezahlt? Zugehörige Rücklage wird abgezogen.'))return;c.saved=rnd(Math.max(0,c.saved-c.amount));c.paid=month();s.history.push({type:c.name+' bezahlt',amount:c.amount,date:new Date().toLocaleString('de-DE')});save();render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='regiosnack-sicherung.json';a.click();URL.revokeObjectURL(a.href)}
$('restore').onchange=async()=>{try{let x=JSON.parse(await $('restore').files[0].text());if(!Array.isArray(x.costs)||!Array.isArray(x.history)||!x.inputs||!x.costs.every(c=>typeof c.name==='string'&&Number.isFinite(c.amount)&&c.amount>0&&Number.isFinite(c.saved)&&c.saved>=0&&Number.isInteger(c.due)&&c.due>=1&&c.due<=31))throw Error();if(confirm('Daten ersetzen?')){s=x;save();location.reload()}}catch{alert('Ungültige Sicherung')}};save();render();setInterval(()=>{if(s.cashDate!==today()){s.cashDate=today();s.inputs.cash='';$('cash').value='';save();render()}},30000);
</script></html>
